services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_DATABASE: order_db
      MYSQL_ROOT_PASSWORD: Prometeo$$4
    ports:
      - "3306:3306"
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-db:
    image: postgres:16
    container_name: postgres-db
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  # ---------------------------------------------------------------------------
  # GESTOR DE MENSAJERÍA (RabbitMQ con Panel de Control Web)
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"   # Puerto de mensajería AMQP
      - "15672:15672" # Panel web (http://localhost:15672 - usuario: guest / pass: guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  # ---------------------------------------------------------------------------
  # EUREKA SERVER (Servidor de descubrimiento)
  # ---------------------------------------------------------------------------
  eureka-server:
    build:
      context: ./eureka-server # Ruta al código fuente del Eureka Server
      dockerfile: Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8761/"]
      interval: 10s
      timeout: 5s
      retries: 10
  # ---------------------------------------------------------------------------
  # ORDER SERVICE (Productor de eventos)
  # ---------------------------------------------------------------------------
  product-service:
    build:
      context: ./productsrvc # Ruta al código fuente del Order Service
      dockerfile: Dockerfile
    container_name: product-service
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres-db:5432/ecommerce
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      postgres-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - microservices-net
  # ---------------------------------------------------------------------------
  # ORDER SERVICE (Productor de eventos)
  # ---------------------------------------------------------------------------
  order-service:
    build:
      context: ./ordersrvc # Ruta al código fuente del Order Service
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      - "8082:8082"
    environment:
      DB_URL: jdbc:mysql://mysql-db:3306/order_db
      DB_USER: root
      DB_PASSWORD: Prometeo$$4
    depends_on:
      mysql-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - microservices-net

# ---------------------------------------------------------------------------
  # NOTIFICATION SERVICE (Notificacion asincrona)
  # ---------------------------------------------------------------------------
  notification-service:
    build:
      context: ./notification-service # Ruta al código fuente del Notification Service
      dockerfile: Dockerfile
    container_name: notification-service
    ports:
      - "8083:8083"
    depends_on:
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      order-service:
        condition: service_started
    networks:
      - microservices-net
  # ---------------------------------------------------------------------------
  # GATEWAY SERVICE (Puerta de enlace)
  # ---------------------------------------------------------------------------
  gateway-service:
    build:
      context: ./api-gateway # Ruta al código fuente del Gateway Service
      dockerfile: Dockerfile
    container_name: gateway-service
    ports:
      - "8080:8080"
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - microservices-net
  
# -----------------------------------------------------------------------------
# RED COMPARTIDA ENTRE CONTENEDORES
# -----------------------------------------------------------------------------
networks:
  microservices-net:
    driver: bridge