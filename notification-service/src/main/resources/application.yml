spring:
  application:
    name: notification-service
  server:
    port: 8083
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: ${RABBITMQ_DEFAULT_USER:guest}
    password: ${RABBITMQ_DEFAULT_PASS:guest}
eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka